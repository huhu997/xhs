<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{width:750px;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;background:#FFFFFF;color:#1D1D1F}
.hd{background:#FFFFFF;color:#1D1D1F;padding:46px 48px;border-bottom:1px solid #E8E8ED}
.hd .b{background:#0071E3;color:#fff;display:inline-block;font-size:22px;font-weight:700;padding:6px 18px;border-radius:999px;margin-bottom:18px}
.hd h1{font-size:44px;font-weight:700;line-height:1.3;color:#1D1D1F}
.hd p{font-size:24px;color:#8E8E93;font-weight:400;margin-top:12px;line-height:1.5}
.sec{padding:38px 48px;border-bottom:1px solid #E8E8ED;background:#FFFFFF}
.sec h2{font-size:32px;font-weight:700;color:#1D1D1F;margin-bottom:20px;padding-left:16px;border-left:6px solid #0071E3}
.sec ul{list-style:none}
.sec li{font-size:26px;line-height:1.72;color:#1D1D1F;padding:7px 0 7px 28px;position:relative}
.sec li::before{content:"";position:absolute;left:2px;top:19px;width:11px;height:11px;background:#0071E3;border-radius:2px}
.cards{display:flex;gap:14px}
.card{flex:1;background:#F5F5F7;border:1px solid #E8E8ED;border-radius:18px;padding:20px 14px;text-align:center}
.card .n{font-size:30px;font-weight:800;color:#0071E3;line-height:1.25}
.card .t{font-size:21px;color:#8E8E93;margin-top:8px;line-height:1.5}
.steps{display:flex;flex-direction:column;gap:24px}
.step{display:flex;align-items:center;gap:22px;background:#FFFFFF;border:1px solid #E8E8ED;border-radius:18px;padding:22px 26px}
.step .n{width:64px;height:64px;flex:none;border-radius:50%;background:#0071E3;color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.step .x{font-size:30px;font-weight:800;line-height:1.25}
.step .y{font-size:24px;color:#8E8E93;margin-top:4px;line-height:1.3}
.ft{background:#F5F5F7;color:#8E8E93;padding:32px 48px;font-size:21px;line-height:1.7}
.ft b{color:#1D1D1F}
</style></head><body>
<div class="hd"><span class="b">{{HD_BADGE}}</span><h1>{{HD_TITLE}}</h1><p>{{HD_SUB}}</p></div>
{{SECTIONS}}
<div class="ft"><b>说明：</b>{{FT}}</div>
</body></html>
