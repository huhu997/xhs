<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:800px;font-family:"Microsoft YaHei",sans-serif;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.box{width:660px;height:660px;border:6px solid #0f1a33;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(155deg,#f4f6fb,#ffffff)}
.title{font-size:70px;font-weight:900;color:#0f1a33;text-align:center;line-height:1.2;padding:0 30px}
.title .o{color:#FF5000}
.sub{margin-top:26px;font-size:30px;color:#5a6a85;text-align:center}
</style></head><body>
<div class="box">
<div class="title">{{WB_TITLE}}</div>
<div class="sub">{{WB_SUB}}</div>
</div></body></html>
