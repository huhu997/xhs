<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:800px;font-family:"Microsoft YaHei",sans-serif;overflow:hidden;background:#0f1a33}
.wrap{width:800px;height:800px;background:linear-gradient(155deg,#0f1a33 0%,#17264d 60%,#1e3263 100%);color:#fff;padding:52px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.wrap::after{content:"";position:absolute;right:-140px;top:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,80,0,.32),transparent 70%)}
.badge{align-self:flex-start;background:#FF5000;color:#fff;font-size:24px;font-weight:700;padding:8px 22px;border-radius:999px;position:relative}
.title{margin-top:32px;font-size:64px;font-weight:900;line-height:1.24;letter-spacing:1px;position:relative}
.title .o{color:#FFB25E}
.sub{margin-top:18px;font-size:26px;color:#c9d6ef;line-height:1.55;position:relative}
.points{margin-top:auto;display:flex;flex-direction:column;gap:14px;position:relative}
.pt{font-size:31px;font-weight:700;border-left:7px solid #FF5000;padding-left:18px;line-height:1.35}
.foot{margin-top:26px;display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#8fa3c8;position:relative}
.price{color:#FFB25E;font-size:30px;font-weight:800}
</style></head><body><div class="wrap">
<div class="badge">虚拟商品 · 自动发货</div>
<div class="title">2026 AI变现<br/><span class="o">赚钱教程</span></div>
<div class="sub">零基础起步 · 网盘秒发 · 周更工具清单</div>
<div class="points"><div class="pt">60+ 页实操教程</div><div class="pt">2026 最新工具清单</div><div class="pt">选方向 → 做内容 → 出第一单</div></div>
<div class="foot"><span class="price">1.98 元起</span><span>拍下即发 · 详情见页面</span></div>
</div></body></html>
