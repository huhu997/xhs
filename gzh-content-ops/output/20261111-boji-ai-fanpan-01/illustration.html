<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>illustration 16:9 · 第1集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    background-color: #E9E6DE;
    font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  .head {
    height: 148px; background-color: #17181C;
    padding: 0 72px; display: table; width: 100%;
  }
  .head .h-l, .head .h-r { display: table-cell; vertical-align: middle; }
  .head .h-r { text-align: right; }
  .head .t1 { color: #FFFFFF; font-size: 52px; font-weight: 700; letter-spacing: 2px; }
  .head .t2 { color: #E8743B; font-size: 24px; letter-spacing: 4px; }
  .wrap { padding: 62px 72px 0; }
  table.cards { width: 100%; border-collapse: separate; border-spacing: 28px; }
  table.cards td { width: 50%; vertical-align: top; }
  .card {
    background-color: #FFFFFF;
    border: 1px solid #D8DEE7;
    border-top: 6px solid #B9B5AC;
    border-radius: 14px;
    padding: 42px 46px 46px;
    height: 470px;
  }
  .card.now { border-top-color: #E8743B; }
  .card .no { color: #1F2933; font-size: 76px; font-weight: 700; line-height: 1; opacity: .18; }
  .card .title { color: #1F2933; font-size: 38px; font-weight: 700; margin-top: 26px; line-height: 1.35; }
  .card .status { color: #44515F; font-size: 26px; margin-top: 20px; font-weight: 600; }
  .card.now .status { color: #E8743B; }
  .card .desc { color: #44515F; font-size: 24px; line-height: 1.75; margin-top: 26px; }
  .card .list { color: #44515F; font-size: 24px; line-height: 1.75; margin-top: 26px; }
  .card .list div { margin-bottom: 6px; }
  .foot {
    margin: 44px 72px 0; padding-top: 26px;
    border-top: 1px solid #D8DEE7;
    color: #44515F; font-size: 25px; letter-spacing: 1px;
  }
  .foot b { color: #1F2933; }
</style>
</head>
<body>
  <div class="head">
    <div class="h-l"><div class="t1">删它，不是因为不对</div></div>
    <div class="h-r"><div class="t2">薄肌 AI 翻盘 · 第 1 集</div></div>
  </div>
  <div class="wrap">
    <table class="cards">
      <tr>
        <td>
          <div class="card">
            <div class="no">01</div>
            <div class="title">审美早变了，<br>不是人形货架</div>
            <div class="status">最容易被截图</div>
            <div class="desc">练大块头的刷到这句，容易觉得在说他。评论区一开吵，四张卡就白做了。</div>
          </div>
        </td>
        <td>
          <div class="card now">
            <div class="no">02</div>
            <div class="title">留下的四句</div>
            <div class="status">每句只答一件事</div>
            <div class="list">
              <div>薄肌不是瘦</div>
              <div>大块头代价太贵</div>
              <div>每周四次、四十分钟</div>
              <div>自律是底层操作系统</div>
            </div>
          </div>
        </td>
      </tr>
    </table>
  </div>
  <div class="foot"><b>26 秒，四张卡。</b>　两小时做完，大半时间花在删。</div>
</body>
</html>
