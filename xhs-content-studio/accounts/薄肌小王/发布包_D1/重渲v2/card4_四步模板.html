<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI Emoji","Segoe UI",sans-serif;
  background:linear-gradient(160deg,#fff7f0 0%,#ffe2d2 100%);
  color:#1d1d1f; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:1440px;
}
.wrap { width:88%; max-width:960px; }
.head { margin-bottom:8px; }
h2 { font-size:64px; font-weight:800; letter-spacing:-0.5px; }
h2 .u { background:linear-gradient(transparent 64%, #ffc9b8 64%); padding:0 2px; }
.sub { font-size:32px; color:#b06a4f; font-weight:600; margin-bottom:32px; }
.steps { display:flex; flex-direction:column; gap:18px; margin-bottom:28px; }
.step { display:flex; align-items:center; gap:22px; background:#fff; border:1px solid #ffe0d2; border-radius:20px; padding:26px 30px; box-shadow:0 4px 18px rgba(255,90,60,0.10); }
.badge { flex:0 0 auto; width:74px; height:74px; border-radius:50%; background:#ff5a3c; color:#fff; font-size:36px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.emoji { font-size:46px; flex:0 0 auto; }
.txt { font-size:38px; line-height:1.42; }
.txt b { color:#ff5a3c; font-size:42px; }
.foot { background:#fff3ec; border:1px solid #ffd0bc; border-radius:20px; padding:28px 32px; font-size:34px; color:#7a3a26; line-height:1.45; box-shadow:0 4px 18px rgba(255,90,60,0.10); }
.foot b { color:#ff5a3c; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h2>我的<span class="u">信息整理四步</span></h2></div>
  <div class="sub">🧾 普通人也能抄的模板</div>
  <div class="steps">
    <div class="step"><span class="badge">01</span><span class="emoji">📥</span><span class="txt"><b>输入</b>　先把碎片信息收口到一个入口</span></div>
    <div class="step"><span class="badge">02</span><span class="emoji">🗂️</span><span class="txt"><b>分类</b>　按「是否主线 / 是否复用」二分</span></div>
    <div class="step"><span class="badge">03</span><span class="emoji">📌</span><span class="txt"><b>沉淀</b>　模板化，别每次重新想</span></div>
    <div class="step"><span class="badge">04</span><span class="emoji">♻️</span><span class="txt"><b>复用</b>　建检索，用的时候 10 秒调出</span></div>
  </div>
  <div class="foot">完整版模板我整理好了，扣【模板】发你（<b>真实记录</b>）</div>
</div>
</body>
</html>
