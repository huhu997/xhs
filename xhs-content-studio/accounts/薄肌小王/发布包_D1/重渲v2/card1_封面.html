<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI Emoji","Segoe UI",sans-serif;
  background:linear-gradient(160deg,#fff7f0 0%,#ffe2d2 100%);
  color:#1d1d1f; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:1080px;
}
.wrap { width:88%; max-width:960px; }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:44px; }
.pill { background:#ff5a3c; color:#fff; font-size:30px; padding:12px 28px; border-radius:999px; font-weight:700; }
.rec { font-size:30px; color:#b06a4f; font-weight:600; }
.hero { font-size:88px; line-height:1.18; font-weight:800; letter-spacing:-1px; }
.hero .hl { background:linear-gradient(transparent 62%, #ffc9b8 62%); padding:0 4px; }
.anchor { display:flex; align-items:flex-end; gap:20px; margin:34px 0 28px; }
.anchor .big { font-size:150px; font-weight:800; color:#ff5a3c; line-height:0.9; letter-spacing:-4px; }
.anchor .lab { font-size:34px; color:#7a4a3a; line-height:1.32; padding-bottom:14px; }
.card { background:#fff; border:1px solid #ffe0d2; border-radius:22px; padding:30px 36px; font-size:36px; color:#1d1d1f; box-shadow:0 6px 26px rgba(255,90,60,0.12); line-height:1.45; margin-bottom:32px; }
.card b { color:#ff5a3c; }
.foot { font-size:33px; color:#c0392b; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="pill">信息整理 · AI 知识管理</span>
    <span class="rec">🧾 真实记录</span>
  </div>
  <h1 class="hero">你囤的 100 个 AI 工具<br><span class="hl">大多留不下来</span></h1>
  <div class="anchor">
    <span class="big">300</span>
    <span class="lab">篇 AI 工具笔记<br>我一篇篇扒完的真相</span>
  </div>
  <div class="card">真正高赞的不是工具，<br>是能抄的「<b>模板</b>」</div>
  <div class="foot">🌱 普通人视角：先搭体系，比囤工具实在</div>
</div>
</body>
</html>
