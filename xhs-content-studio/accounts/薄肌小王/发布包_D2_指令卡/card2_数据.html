<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI Emoji","Segoe UI",sans-serif;
  background:linear-gradient(160deg,#fff7f0 0%,#ffe2d2 100%);
  color:#1d1d1f; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:1440px;
}
.wrap { width:86%; max-width:940px; }
.pill { display:inline-block; background:#ff5a3c; color:#fff; font-size:30px; padding:12px 28px; border-radius:999px; font-weight:700; margin-bottom:44px; }
h2 { font-size:66px; font-weight:800; letter-spacing:-0.5px; line-height:1.25; margin-bottom:52px; }
h2 .u { background:linear-gradient(transparent 64%, #ffc9b8 64%); padding:0 2px; }
.vs { display:flex; align-items:stretch; gap:22px; margin-bottom:40px; }
.box { flex:1; background:#fff; border:1px solid #ffe0d2; border-radius:22px; padding:40px 28px 36px; box-shadow:0 6px 26px rgba(255,90,60,0.10); }
.box .n { font-size:112px; font-weight:800; color:#ff5a3c; line-height:0.9; letter-spacing:-3px; }
.box .u { font-size:30px; color:#b06a4f; font-weight:700; margin-top:16px; }
.box .d { font-size:31px; color:#1d1d1f; line-height:1.45; margin-top:26px; }
.box.win { border:2px solid #ff5a3c; }
.mid { display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:#ff5a3c; letter-spacing:1px; }
.desc { background:#fff; border:1px solid #ffe0d2; border-radius:20px; padding:30px 34px; font-size:33px; line-height:1.5; box-shadow:0 4px 18px rgba(255,90,60,0.10); margin-bottom:30px; }
.concl { background:#fff3ec; border:1px solid #ffd0bc; border-radius:20px; padding:32px 36px; font-size:38px; line-height:1.45; color:#7a3a26; font-weight:700; box-shadow:0 4px 18px rgba(255,90,60,0.10); margin-bottom:40px; }
.concl b { color:#ff5a3c; }
.foot { font-size:31px; color:#c0392b; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pill">信息整理 · AI 提效</div>
  <h2>先认出你手里<span class="u">是哪种「乱」</span></h2>
  <div class="vs">
    <div class="box win">
      <div class="n">文字</div>
      <div class="u">类 · 3 种</div>
      <div class="d">一坨长文 → 压成要点<br>散笔记 → 归类合并<br>一堆素材 → 整理成提纲</div>
    </div>
    <div class="mid">＋</div>
    <div class="box">
      <div class="n">信息</div>
      <div class="u">类 · 3 种</div>
      <div class="d">零散数据 → 变成一张表<br>评论反馈 → 提炼诉求<br>一份资料 → 复用框架</div>
    </div>
  </div>
  <div class="desc">6 种情况各配一句指令，不用自己琢磨该怎么开口</div>
  <div class="concl"><b>看场景 → 换变量 → 整段复制</b><br>一张卡只管一件事</div>
  <div class="foot">🌱 每张都写了「别编 / 别猜 / 缺的标出来」</div>
</div>
</body>
</html>
