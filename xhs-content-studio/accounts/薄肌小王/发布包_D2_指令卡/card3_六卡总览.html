<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI Emoji","Segoe UI",sans-serif;
  background:linear-gradient(160deg,#fff7f0 0%,#ffe2d2 100%);
  color:#1d1d1f; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:1440px;
}
.wrap { width:86%; max-width:940px; }
.pill { display:inline-block; background:#ff5a3c; color:#fff; font-size:30px; padding:12px 28px; border-radius:999px; font-weight:700; margin-bottom:40px; }
h2 { font-size:52px; font-weight:800; letter-spacing:-0.5px; line-height:1.25; white-space:nowrap; }
h2 .u { background:linear-gradient(transparent 64%, #ffc9b8 64%); padding:0 2px; }
.sub { font-size:32px; color:#b06a4f; font-weight:600; margin:14px 0 40px; }
.steps { display:flex; flex-direction:column; gap:16px; margin-bottom:40px; }
.step { display:flex; align-items:center; gap:22px; background:#fff; border:1px solid #ffe0d2; border-radius:20px; padding:24px 28px; box-shadow:0 4px 18px rgba(255,90,60,0.10); }
.badge { flex:0 0 auto; width:70px; height:70px; border-radius:50%; background:#ff5a3c; color:#fff; font-size:30px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.emoji { font-size:44px; flex:0 0 auto; }
.txt { font-size:37px; line-height:1.4; }
.txt .to { color:#b06a4f; font-size:32px; margin:0 8px; }
.txt b { color:#ff5a3c; }
.foot { background:#fff3ec; border:1px solid #ffd0bc; border-radius:20px; padding:28px 32px; font-size:29px; color:#7a3a26; line-height:1.45; box-shadow:0 4px 18px rgba(255,90,60,0.10); }
.foot b { color:#ff5a3c; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pill">信息整理 · AI 提效</div>
  <h2>6 张指令卡，各管一种<span class="u">「资料乱」</span></h2>
  <div class="sub">🗂️ 复制就能用</div>
  <div class="steps">
    <div class="step"><span class="badge">01</span><span class="emoji">🧹</span><span class="txt">一坨长文<span class="to">→</span><b>压成要点</b></span></div>
    <div class="step"><span class="badge">02</span><span class="emoji">🗂️</span><span class="txt">一堆散笔记<span class="to">→</span><b>归类合并</b></span></div>
    <div class="step"><span class="badge">03</span><span class="emoji">📊</span><span class="txt">一堆零散数据<span class="to">→</span><b>变成一张表</b></span></div>
    <div class="step"><span class="badge">04</span><span class="emoji">💬</span><span class="txt">一堆评论反馈<span class="to">→</span><b>提炼诉求</b></span></div>
    <div class="step"><span class="badge">05</span><span class="emoji">✍️</span><span class="txt">一堆素材<span class="to">→</span><b>整理成提纲</b></span></div>
    <div class="step"><span class="badge">06</span><span class="emoji">📌</span><span class="txt">一份资料<span class="to">→</span><b>变成能复用的框架</b></span></div>
  </div>
  <div class="foot">每张都写好了 <b>适用场景 + 指令原文 + 怎么填变量 + 使用提示</b></div>
</div>
</body>
</html>
