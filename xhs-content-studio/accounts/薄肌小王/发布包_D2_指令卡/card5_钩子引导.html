<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI Emoji","Segoe UI",sans-serif;
  background:linear-gradient(160deg,#fff7f0 0%,#ffe2d2 100%);
  color:#1d1d1f; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:1440px;
}
.wrap { width:86%; max-width:940px; }
.pill { display:inline-block; background:#ff5a3c; color:#fff; font-size:30px; padding:12px 28px; border-radius:999px; font-weight:700; margin-bottom:48px; }
h2 { font-size:70px; font-weight:800; letter-spacing:-0.5px; line-height:1.25; margin-bottom:52px; }
h2 .u { background:linear-gradient(transparent 64%, #ffc9b8 64%); padding:0 2px; }
.cta { background:#ff5a3c; color:#fff; border-radius:28px; padding:66px 40px; text-align:center; font-size:66px; font-weight:800; line-height:1.35; box-shadow:0 10px 34px rgba(255,90,60,0.30); margin-bottom:40px; }
.cta .kw { display:inline-block; background:#fff; color:#ff5a3c; border-radius:16px; padding:4px 20px; }
.desc { background:#fff; border:1px solid #ffe0d2; border-radius:20px; padding:30px 34px; font-size:30px; line-height:1.5; color:#1d1d1f; box-shadow:0 4px 18px rgba(255,90,60,0.10); margin-bottom:34px; }
.desc b { color:#ff5a3c; }
.tags { display:flex; gap:16px; margin-bottom:48px; }
.tag { flex:1; text-align:center; background:#fff3ec; border:1px solid #ffd0bc; border-radius:999px; padding:18px 8px; font-size:30px; color:#c0392b; font-weight:700; }
.foot { font-size:31px; color:#7a3a26; font-weight:600; line-height:1.45; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pill">信息整理 · AI 提效</div>
  <h2>想要<span class="u">这 6 张卡</span>？</h2>
  <div class="cta">扣 <span class="kw">【指令】</span><br>领 6 张完整指令卡</div>
  <div class="desc">6 张都写好了 <b>适用场景 + 指令原文 + 怎么填变量 + 使用提示</b>，复制就能用</div>
  <div class="tags">
    <div class="tag">6 张齐全</div>
    <div class="tag">复制就能用</div>
    <div class="tag">纯分享不卖课</div>
  </div>
  <div class="foot">💬 评论区说一个你常遇到的「资料乱」，看看能不能也写成一张卡</div>
</div>
</body>
</html>
