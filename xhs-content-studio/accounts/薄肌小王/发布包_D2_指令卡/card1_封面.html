<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI Emoji","Segoe UI",sans-serif;
  background:linear-gradient(160deg,#fff7f0 0%,#ffe2d2 100%);
  color:#1d1d1f; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:1440px;
}
.wrap { width:86%; max-width:940px; }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:60px; }
.pill { background:#ff5a3c; color:#fff; font-size:30px; padding:12px 28px; border-radius:999px; font-weight:700; }
.rec { font-size:30px; color:#b06a4f; font-weight:600; }
.hero { font-size:82px; line-height:1.26; font-weight:800; letter-spacing:-1px; }
.hero .hl { background:linear-gradient(transparent 62%, #ffc9b8 62%); padding:0 4px; color:#ff5a3c; }
.anchor { display:flex; align-items:flex-end; gap:24px; margin:56px 0 44px; }
.anchor .big { font-size:168px; font-weight:800; color:#ff5a3c; line-height:0.85; letter-spacing:-5px; }
.anchor .lab { font-size:31px; color:#7a4a3a; line-height:1.42; padding-bottom:12px; }
.card { background:#fff; border:1px solid #ffe0d2; border-radius:22px; padding:34px 38px; font-size:36px; color:#1d1d1f; box-shadow:0 6px 26px rgba(255,90,60,0.12); line-height:1.5; margin-bottom:44px; }
.card b { color:#ff5a3c; }
.foot { font-size:32px; color:#c0392b; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="pill">信息整理 · AI 提效</span>
    <span class="rec">📌 6 张可直接复制</span>
  </div>
  <h1 class="hero">一坨长文<br>一堆散笔记<br><span class="hl">6 张卡</span>直接抄</h1>
  <div class="anchor">
    <span class="big">06</span>
    <span class="lab">种常见的「资料乱」<br>各配一句能直接复制的指令</span>
  </div>
  <div class="card">不用自己想怎么问，<br>看场景 → 换变量 → <b>整段复制</b></div>
  <div class="foot">🌱 长文 / 笔记 / 数据 / 评论 / 素材 / 文档，都能用</div>
</div>
</body>
</html>
